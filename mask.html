<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chalita AR Face Mask</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="maskTexture" src="fox.png" crossorigin="anonymous">
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!--
      anchorIndex: 168 = จุดกึ่งกลางระหว่างคิ้ว/สันจมูกบน (glabella)
      เป็นจุดยึดมาตรฐานสำหรับแว่น/หน้ากากที่ต้องคุมตำแหน่งแม่นๆ

      ถ้าหน้ากากยังไม่ตรงตา ปรับได้ที่ 3 ค่านี้บน <a-plane> ด้านล่าง:
        - position="x y z"  -> y ค่าลบมาก = เลื่อนหน้ากากลงต่ำ, y ค่าบวกมาก = เลื่อนขึ้น
                               x ค่าบวก = เลื่อนขวา, x ค่าลบ = เลื่อนซ้าย
        - width / height    -> ตัวเลขมาก = หน้ากากใหญ่ขึ้น, น้อย = เล็กลง
      ปรับทีละ 0.02-0.05 แล้วเซฟ/รีเฟรชดูผลทีละรอบ
    -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-plane
        src="#maskTexture"
        transparent="true"
        material="shader: flat; alphaTest: 0.1"
        position="0 -0.30 0.02"
        rotation="0 0 0"
        width="1.05"
        height="0.95">
      </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
